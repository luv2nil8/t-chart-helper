<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xfinity Plan Builder</title>

<script>
/* ============================================================================
   CONFIG — EDIT EVERYTHING HERE
   ============================================================================
   Each section has a heading and a list of items.  Each item has:
     id       : unique internal name (no spaces). Used by the logic only.
     label    : short text shown ON the button.
     price    : dollars per month (a number). Used for the running total.
     summary  : the line that gets COPIED to the clipboard when selected.
     exclusive: (optional) group name. Items sharing a group can't both be
                picked — choosing one deselects the other (e.g. internet tiers).

   Sections also have:
     heading  : the bold title shown above the buttons.
     details  : the fine-print text shown when "+ details" is toggled.
                Use \n for new lines.
   ============================================================================ */
const CONFIG = {

  /* ---------------- INTERNET ---------------- */
  internet: {
    heading: '𝐈𝐧𝐭𝐞𝐫𝐧𝐞𝐭',
    bundleCategory: 'internet',            // required for any bundle discount
    exclusive: 'internet',                 // only one internet plan at a time
    details: '• Unlimited data · No caps · 5-yr price lock · AutoPay bank acct = −$10ᴍᴏ · Self-install free / Pro $100',
    items: [
      { id:'now-prepaid', label:'NOW Prepaid', price:30,  summary:'𝐈𝐧𝐭𝐞𝐫𝐧𝐞𝐭: NOW Prepaid $30ᴍᴏ · 100 Mbps' },
      { id:'i300',        label:'300 Mbps',    price:45,  summary:'𝐈𝐧𝐭𝐞𝐫𝐧𝐞𝐭: 300 Mbps $45ᴍᴏ' },
      { id:'i500',        label:'500 Mbps',    price:55,  summary:'𝐈𝐧𝐭𝐞𝐫𝐧𝐞𝐭: 500 Mbps $55ᴍᴏ' },
      { id:'igig',        label:'Gigabit ⭐',  price:60,  summary:'𝐈𝐧𝐭𝐞𝐫𝐧𝐞𝐭: Gigabit $60ᴍᴏ' },
      { id:'i2gig',       label:'2 Gbps',      price:100, summary:'𝐈𝐧𝐭𝐞𝐫𝐧𝐞𝐭: 2 Gbps $100ᴍᴏ' },
    ],
  },

  /* ---------------- INTERNET ESSENTIALS (low-income) ---------------- */
  essentials: {
    heading: '𝐈𝐧𝐭𝐞𝐫𝐧𝐞𝐭 𝐄𝐬𝐬𝐞𝐧𝐭𝐢𝐚𝐥𝐬',
    bundleCategory: 'internet',            // still counts as internet for bundles
    exclusive: 'internet',                 // and is exclusive with the tiers above
    details: 'Qualifies with ANY of:\n• SNAP · Medicaid · SSI · TANF\n• National School Lunch Program / Head Start\n• Public / Section 8 housing assistance\n• LIHEAP · WIC · VA Pension · Pell Grant\n• Income-based: ≤$2,510ᴍᴏ ($30,120/yr) single\n\n• Must be new Xfinity customer (no service in last 90 days)\n• No outstanding Comcast debt under 1 year\n• Equipment incl. · Self-install · No contract · No credit check\n• Apply: internetessentials.com or 1-855-846-8376',
    items: [
      { id:'ess',     label:'Essentials',  price:14.95, summary:'𝐈𝐧𝐭𝐞𝐫𝐧𝐞𝐭: Essentials $14.95ᴍᴏ · 75 Mbps' },
      { id:'ess-plus',label:'Essentials+', price:29.95, summary:'𝐈𝐧𝐭𝐞𝐫𝐧𝐞𝐭: Essentials+ $29.95ᴍᴏ · 300 Mbps' },
    ],
  },

  /* ---------------- TELEVISION ----------------
     NOW TV / NOW TV Latino are streaming and CANNOT be on the same
     account as cable (Core/Sports/Kids/Premium). They're all in one
     exclusive group so only one TV product can be picked at a time.
     `dvr` is used to show the right DVR hours in the TV details. */
  tv: {
    heading: '𝐓𝐞𝐥𝐞𝐯𝐢𝐬𝐢𝐨𝐧',
    bundleCategory: 'tv',
    exclusive: 'tv',
    // TV details change based on the picked plan. Edit the three templates below.
    // {dvr} is replaced with the selected plan's `dvr` value (e.g. "150hr").
    detailsWhenNone:   '• X1 box · 300hr DVR · Voice remote · 4K · No contract',
    detailsWhenStream: '• No box needed · 20hr DVR · Stream on any device · No contract',
    detailsWhenCable:  '• X1 box · {dvr} DVR · Voice remote · 4K · No contract',
    items: [
      { id:'nowtv',       label:'NOW TV',              price:20,  kind:'stream', dvr:'20hr',  summary:'𝐓𝐞𝐥𝐞𝐯𝐢𝐬𝐢𝐨𝐧: NOW TV $20ᴍᴏ · 125+ ch · 20hr DVR' },
      { id:'nowtv-latino',label:'NOW TV Latino',       price:15,  kind:'stream', dvr:'20hr',  summary:'𝐓𝐞𝐥𝐞𝐯𝐢𝐬𝐢𝐨𝐧: NOW TV Latino $15ᴍᴏ · Spanish-language + local ch' },
      { id:'core',        label:'Core',                price:55,  kind:'cable',  dvr:'150hr', summary:'𝐓𝐞𝐥𝐞𝐯𝐢𝐬𝐢𝐨𝐧: Core $55ᴍᴏ · 10+ ch' },
      { id:'sports',      label:'Sports & News',       price:90,  kind:'cable',  dvr:'300hr', summary:'𝐓𝐞𝐥𝐞𝐯𝐢𝐬𝐢𝐨𝐧: Sports & News $90ᴍᴏ · 50+ ch' },
      { id:'kids',        label:'Kids & Ent',          price:105, kind:'cable',  dvr:'300hr', summary:'𝐓𝐞𝐥𝐞𝐯𝐢𝐬𝐢𝐨𝐧: Kids & Entertainment $105ᴍᴏ · 125+ ch' },
      { id:'premium',     label:'Premium',             price:135, kind:'cable',  dvr:'300hr', summary:'𝐓𝐞𝐥𝐞𝐯𝐢𝐬𝐢𝐨𝐧: Premium $135ᴍᴏ · 185+ ch' },
    ],
    // The row of streaming buttons is split from cable visually — handled in build().
  },

  /* ---------------- STREAMSAVER ----------------
     Basic and Premium are exclusive. The "NOW add-on" is special: it
     upgrades the NOW TV line in place (see NOW_ADDON below) instead of
     adding its own line. */
  stream: {
    heading: '𝐒𝐭𝐫𝐞𝐚𝐦𝐒𝐚𝐯𝐞𝐫',
    exclusive: 'stream',
    details: '• Requires Xfinity internet · Keep existing profiles · 4K stream box incl.',
    items: [
      { id:'ss-basic',   label:'Basic',   price:18, summary:'𝐒𝐭𝐫𝐞𝐚𝐦𝐒𝐚𝐯𝐞𝐫 $18ᴍᴏ · Netflix · Apple TV+ · Peacock' },
      { id:'ss-premium', label:'Premium', price:35, summary:'𝐒𝐭𝐫𝐞𝐚𝐦𝐒𝐚𝐯𝐞𝐫 Premium $35ᴍᴏ · Netflix · Apple TV+ · Peacock · Disney+/Hulu · Max' },
    ],
  },

  /* ---------------- SECURITY ----------------
     Smart Home + Pro Monitoring combine into one $55 line when both are on.
     Pro Monitoring REQUIRES Smart Home (greyed out until Smart Home is picked).
     Cameras are steppers, capped at 6 total (indoor + outdoor). */
  security: {
    heading: '𝐒𝐞𝐜𝐮𝐫𝐢𝐭𝐲',
    bundleCategory: 'security',
    details: '• Smart Home req. for cameras · Cameras: purchase or lease · No contract',
    // toggle items (Smart Home / Pro Monitoring)
    items: [
      { id:'smarthome', label:'Smart Home',     price:10, summary:'𝐒𝐞𝐜𝐮𝐫𝐢𝐭𝐲: Smart Home $10ᴍᴏ' },
      { id:'promon',    label:'Pro Monitoring', price:45, requires:'smarthome', summary:'𝐒𝐞𝐜𝐮𝐫𝐢𝐭𝐲: Pro Monitoring $45ᴍᴏ' },
    ],
    combinedPrice: 55,          // price shown when BOTH smarthome + promon are on
    // camera steppers
    cameras: [
      { id:'indoor',  label:'Indoor',   price:2.50, summaryName:'Indoor' },
      { id:'outdoor', label:'Outdoor',  price:5.00, summaryName:'Out' },
    ],
    cameraMax: 6,               // combined indoor + outdoor limit
  },

  /* ---------------- HOME PHONE ---------------- */
  voice: {
    heading: '𝐇𝐨𝐦𝐞 𝐏𝐡𝐨𝐧𝐞',
    bundleCategory: 'voice',
    details: '• Unlimited nationwide · 90+ countries · Voicemail-to-text · Spam blocking · No contract',
    items: [
      { id:'voice-premier', label:'Voice Premier', price:35, summary:'𝐇𝐨𝐦𝐞 𝐏𝐡𝐨𝐧𝐞: Voice Premier $30–$40ᴍᴏ' },
    ],
  },

  /* ---------------- MOBILE ----------------
     Mobile lines are steppers (0-10 each). Prices are FLAT per line — the
     bundle discount is applied to internet, not to the mobile lines.
     Watch + Tablet combined bill is capped (see mobileDeviceCap). */
  mobile: {
    heading: '𝐌𝐨𝐛𝐢𝐥𝐞',
    details: '𝗣𝗹𝘂𝘀 𝗴𝗲𝘁𝘀 𝘆𝗼𝘂 𝗺𝗼𝗿𝗲:\n• Unlimited data, never slows down\n• 50GB hotspot vs 15GB\n• 4K streaming vs 720p\n• Full device protection: Included\n𝗕𝗼𝘁𝗵 𝗽𝗹𝗮𝗻𝘀 𝗶𝗻𝗰𝗹𝘂𝗱𝗲:\n• Watch & Tablet lines: capped at $35\n• Unlimited hotspot (slower after cap)\n• Works in 200+ countries\n• Free calls to Mexico & Canada\n• Xfinity Call Guard: Blocks Spam',
    lines: [
      { id:'select', label:'𝗦𝗲𝗹𝗲𝗰𝘁', price:30, summaryName:'𝗦𝗲𝗹𝗲𝗰𝘁' },
      { id:'plus',   label:'𝗣𝗹𝘂𝘀',   price:45, summaryName:'𝗣𝗹𝘂𝘀' },
    ],
    devices: [
      { id:'watch',  label:'Smartwatch', price:10, summaryName:'Smartwatch' },
      { id:'tablet', label:'Tablet',     price:20, summaryName:'Tablet' },
    ],
    deviceCap: 35,     // watch + tablet combined billing cap (dollars/mo)
    maxPerStepper: 10, // max count on any single stepper
  },

  /* ---------------- BUNDLE DISCOUNTS ----------------
     Discounts apply to the INTERNET bill and require internet to be selected.
     Service bundle counts how many of {tv, voice, security} are active.
     Mobile bundle is a flat amount if ANY mobile line exists. */
  discounts: {
    doublePlay: 20,   // internet + 1 service
    triplePlay: 40,   // internet + 2 services
    quadPlay:   60,   // internet + 3 services
    mobile:     10,   // flat, if any mobile line + internet
  },
};

/* The NOW add-on button upgrades the NOW TV line to include StreamSaver.
   Edit the price bump / added apps here. */
const NOW_ADDON = {
  price: 10,     // added to NOW TV price ($20 -> $30)
  addLabel: '+$10',
  buttonLabel: 'NOW add-on',
  // The upgraded NOW TV summary line:
  upgradedSummary: '𝐓𝐞𝐥𝐞𝐯𝐢𝐬𝐢𝐨𝐧: NOW TV $30ᴍᴏ · 125+ ch · 20hr DVR · Netflix · Apple TV+ · Peacock',
};

</script>


<!-- ============================================================================
     XFINITY PLAN BUILDER
     ============================================================================

     HOW TO EDIT THIS FILE
     ---------------------
     Almost everything you'll ever want to change lives in ONE place:
     the CONFIG object at the very TOP of the file (right after <title>,
     search for "const CONFIG").  You do NOT need to touch the HTML or logic.

     Common edits:
       • Change a price   -> find the plan in CONFIG, edit its `price`.
       • Change a label   -> edit `label` (button text) or `summary` (copied text).
       • Change details   -> edit the `details` string for that section.
       • Add a new plan    -> copy an existing { ... } line in the same section
                             and change its values.  Keep the `id` unique.
       • Remove a plan     -> delete its { ... } line.

     Notes on formatting:
       • Bold header text like 𝐈𝐧𝐭𝐞𝐫𝐧𝐞𝐭 or 𝗦𝗲𝗹𝗲𝗰𝘁 uses Unicode bold
         characters so it survives copy/paste into tools that strip HTML.
         Copy an existing one to reuse the style.
       • In `details`, use \n to start a new line.
     ============================================================================ -->

<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap');

  /* ---- Color + font theme (safe to tweak) ---- */
  :root {
    --bg:#0d0d0f; --surface:#16161a; --surface2:#1e1e24;
    --border:rgba(255,255,255,0.08); --accent:#4f7fff; --accent-dim:rgba(79,127,255,0.15);
    --text:#e8e8f0; --muted:#888899; --faint:#444455;
    --green:#3ddc84; --green-dim:rgba(61,220,132,0.12); --green-border:rgba(61,220,132,0.35);
    --red:#ff5f6d; --mono:'DM Mono',monospace; --sans:'DM Sans',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);height:100vh;display:grid;grid-template-columns:1fr 380px;grid-template-rows:auto 1fr;overflow:hidden}

  /* ---- Responsive: stack panels on iPad / phone ---- */
  @media(max-width:820px){
    body{grid-template-columns:1fr;grid-template-rows:auto 1fr;height:100vh;overflow:hidden}
    header .hint{display:none}
    .panel-left{border-right:none;border-bottom:1px solid var(--border);overflow-y:auto;height:50vh}
    .panel-right{border-top:1px solid var(--border);height:50vh;overflow:hidden;display:flex;flex-direction:column}
    .preview{flex:1;min-height:0;overflow-y:auto}
    .actions{flex-shrink:0;position:relative;bottom:auto}
  }

  header{grid-column:1/-1;padding:13px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;background:var(--surface)}
  .logo{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);background:var(--accent-dim);padding:3px 9px;border-radius:4px;border:1px solid rgba(79,127,255,0.3)}
  header h1{font-size:14px;font-weight:500}
  header .hint{font-size:11px;color:var(--muted);margin-left:auto}
  .panel-left{padding:14px 18px;overflow-y:auto;border-right:1px solid var(--border)}
  .panel-right{display:flex;flex-direction:column;background:var(--surface);overflow:hidden;min-height:0}

  /* Section */
  .section{margin-bottom:16px}
  .section-label{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-bottom:6px;border-bottom:1px solid var(--border);margin-bottom:7px}
  .detail-row{margin-top:6px}
  .btn-detail{background:none;border:1px solid var(--faint);border-radius:4px;padding:2px 8px;font-size:10px;font-family:var(--sans);color:var(--faint);cursor:pointer;transition:color .1s,border-color .1s,background .1s;white-space:nowrap;line-height:1.6}
  .btn-detail:hover{color:var(--muted);border-color:var(--muted)}
  .btn-detail.active{background:var(--green-dim);border-color:var(--green-border);color:#7effc0}

  /* Item buttons */
  .btn-grid{display:flex;flex-wrap:wrap;gap:5px}
  .item{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:4px 9px;font-size:12px;font-family:var(--sans);color:var(--text);cursor:pointer;transition:background .12s,border-color .12s,color .12s,transform .08s;line-height:1.4;text-align:left}
  .item:hover{background:var(--surface2);border-color:rgba(255,255,255,0.18)}
  .item:active{transform:scale(0.96)}
  .item.active{background:var(--accent-dim);border-color:var(--accent);color:#a8c0ff}
  .item .price{font-family:var(--mono);font-size:10px;color:var(--muted);margin-left:3px}
  .item.active .price{color:rgba(168,192,255,0.7)}
  .item.disabled{opacity:.3;cursor:not-allowed;pointer-events:none}

  /* Steppers (mobile lines + cameras) */
  .mobile-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
  .mobile-row{display:flex;align-items:stretch;background:var(--surface);border:1px solid var(--border);border-radius:6px;overflow:hidden;transition:border-color .12s;width:100%}
  .mobile-row.active{border-color:var(--accent)}
  .mobile-label{flex:1;padding:5px 10px;font-size:12px;color:var(--text);user-select:none;transition:background .12s,color .12s;display:flex;align-items:center}
  .mobile-row.active .mobile-label{color:#a8c0ff;background:var(--accent-dim)}
  .mobile-label .price{font-family:var(--mono);font-size:10px;color:var(--muted);margin-left:4px}
  .mobile-row.active .mobile-label .price{color:rgba(168,192,255,0.7)}
  .stepper{display:flex;align-items:center;border-left:1px solid var(--border);flex-shrink:0}
  .mobile-row.active .stepper{border-color:rgba(79,127,255,0.3)}
  .step-btn{background:none;border:none;color:var(--muted);width:26px;height:100%;min-height:28px;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:color .1s,background .1s;font-family:var(--mono);line-height:1}
  .step-btn:hover{color:var(--text);background:var(--surface2)}
  .mobile-row.active .step-btn:hover{background:rgba(79,127,255,0.2);color:#a8c0ff}
  .step-btn:disabled{opacity:.2;cursor:default}
  .step-btn:disabled:hover{background:none;color:var(--muted)}
  .step-count{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--text);min-width:20px;text-align:center}
  .mobile-row.active .step-count{color:#a8c0ff}

  /* Right panel */
  .panel-right-header{padding:10px 14px 9px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
  .panel-right-header span{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .count-badge{font-size:10px;font-family:var(--mono);background:var(--accent-dim);color:var(--accent);padding:2px 8px;border-radius:20px;border:1px solid rgba(79,127,255,0.25)}
  .preview{flex:1;min-height:0;padding:9px 12px;font-family:var(--mono);font-size:11.5px;line-height:1.8;color:var(--text);overflow-y:auto}
  .preview .empty{color:var(--faint);font-style:italic}
  .preview .line{padding:1px 0;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:5px}
  .preview .line:last-child{border-bottom:none}
  .preview .line.detail-line .line-text{color:var(--muted);font-size:10.5px}
  .line-remove{background:none;border:none;color:var(--faint);cursor:pointer;font-size:12px;line-height:1;padding:0 2px;flex-shrink:0;margin-top:3px;transition:color .1s;font-family:monospace}
  .line-remove:hover{color:var(--red)}
  .no-rm{width:14px;flex-shrink:0;display:inline-block}
  .line-text{flex:1;word-break:break-word}
  .discount-area{border-top:1px solid var(--border);padding:6px 12px 5px;flex-shrink:0}
  .discount-area-label{font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--green);opacity:.6;margin-bottom:2px}
  .discount-area-lines{font-family:var(--mono);font-size:10.5px;color:var(--green);line-height:1.6;white-space:pre-wrap}
  .total-bar{padding:5px 14px;border-top:1px solid var(--border);font-size:10px;color:var(--muted);font-family:var(--mono);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
  .total-bar strong{color:var(--green)}
  .total-label{font-size:10px;color:var(--muted);font-family:var(--mono)}
  .actions{padding:8px 12px;border-top:1px solid var(--border);display:flex;gap:7px;align-items:center;flex-shrink:0}
  .btn-copy{flex:1;background:var(--accent);border:none;border-radius:6px;padding:8px 14px;font-family:var(--sans);font-size:12px;font-weight:600;color:#fff;cursor:pointer;transition:opacity .1s,transform .08s;display:flex;align-items:center;justify-content:center;gap:6px}
  .btn-copy:hover{opacity:.88} .btn-copy:active{transform:scale(0.97)} .btn-copy.success{background:#1f7a49}
  .btn-clear{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:8px 11px;font-family:var(--sans);font-size:11px;color:var(--muted);cursor:pointer;transition:color .1s,border-color .1s}
  .btn-clear:hover{color:var(--red);border-color:rgba(255,95,109,0.4)}
  .btn-copy-small{background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:3px 6px;color:var(--muted);cursor:pointer;display:flex;align-items:center;transition:color .1s,border-color .1s}
  .btn-copy-small:hover{color:var(--green);border-color:var(--green-border)}
  .btn-copy-small.success{color:var(--green);border-color:var(--green-border)}
  ::-webkit-scrollbar{width:4px} ::-webkit-scrollbar-track{background:transparent} ::-webkit-scrollbar-thumb{background:var(--faint);border-radius:2px}
</style>
</head>
<body>

<header>
  <div class="logo">Xfinity</div>
  <h1>Plan Builder</h1>
  <span class="hint">Items = bare · + details adds fine print · discounts auto-apply</span>
</header>

<!-- The left panel (all the buttons) is generated automatically from CONFIG. -->
<div class="panel-left" id="panelLeft"></div>

<!-- RIGHT PANEL: plan summary + totals + copy buttons -->
<div class="panel-right">
  <div class="panel-right-header">
    <span>Plan Summary</span>
    <span class="count-badge" id="countBadge">0 items</span>
  </div>
  <div class="preview" id="preview">
    <span class="empty">Click items to build your plan summary...</span>
  </div>
  <div class="discount-area" id="discountArea" style="display:none">
    <div class="discount-area-label">Auto-applied bundle discounts</div>
    <div class="discount-area-lines" id="discountLines"></div>
  </div>
  <div class="total-bar">
    <span class="total-label">Monthly Total</span>
    <div style="display:flex;align-items:center;gap:8px">
      <strong id="totalCount">0</strong>
      <strong id="runningTotal" style="color:var(--green);font-family:var(--mono);font-size:12px">$0ᴍᴏ</strong>
      <button class="btn-copy-small" id="copyTotalBtn" title="Copy total (number only)">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      </button>
    </div>
  </div>
  <div class="actions">
    <button class="btn-copy" id="copyBtn">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      Copy to clipboard
    </button>
    <button class="btn-clear" id="clearBtn">Clear</button>
  </div>
</div>

<script>
/* ============================================================================
   LOGIC — you normally don't need to edit below this line.
   ============================================================================ */

// Look up the NOW TV item + its base/upgraded summaries (used a lot)
const NOW_ITEM       = CONFIG.tv.items.find(i => i.id === 'nowtv');
const NOW_BASE       = NOW_ITEM.summary;
const NOW_UPGRADED   = NOW_ADDON.upgradedSummary;

// Runtime state
const state = {
  selected: {},   // { itemId: true } for toggle items
  steppers: {},   // { stepperId: count } for steppers
  details:  {},   // { sectionKey: true } for open detail panels
  addonActive: false,
};

let monthlyTotal = 0;

/* ---- Build the left panel from CONFIG ---- */
function build() {
  const panel = document.getElementById('panelLeft');
  let html = '';

  // INTERNET
  html += section('internet', grid(CONFIG.internet.items, 'internet'));
  // ESSENTIALS
  html += section('essentials', grid(CONFIG.essentials.items, 'essentials'));

  // TELEVISION — split streaming row from cable row
  const streamItems = CONFIG.tv.items.filter(i => i.kind === 'stream');
  const cableItems  = CONFIG.tv.items.filter(i => i.kind === 'cable');
  html += section('tv',
    `<div class="btn-grid" style="margin-bottom:5px">${buttons(streamItems,'tv')}</div>` +
    `<div class="btn-grid">${buttons(cableItems,'tv')}</div>`
  );

  // STREAMSAVER — normal items + the special NOW add-on button
  const addonBtn = `<button class="item" id="btn-now-addon">${NOW_ADDON.buttonLabel} <span class="price">${NOW_ADDON.addLabel}</span></button>`;
  html += section('stream', `<div class="btn-grid">${buttons(CONFIG.stream.items,'stream')}${addonBtn}</div>`);

  // MOBILE — line steppers + device steppers
  html += section('mobile',
    `<div class="mobile-grid">` +
      CONFIG.mobile.lines.map(l => stepperRow(l.id, l.label, l.price+'/line')).join('') +
      CONFIG.mobile.devices.map((d,i) => stepperRow(d.id, d.label, d.price+'/line', i===0?1:2)).join('') +
    `</div>`
  );

  // SECURITY — toggle items + camera steppers
  html += section('security',
    `<div class="btn-grid">${buttons(CONFIG.security.items,'security')}</div>` +
    `<div class="mobile-grid" style="margin-top:5px">` +
      CONFIG.security.cameras.map(c => stepperRow(c.id, c.label, c.price)).join('') +
    `</div>`
  );

  // VOICE
  html += section('voice', grid(CONFIG.voice.items,'voice'));

  panel.innerHTML = html;
}

// Build a full section wrapper with heading, body, and + details toggle
function section(key, body) {
  const cfg = CONFIG[key];
  const detail = cfg.details !== undefined || key === 'tv'
    ? `<div class="detail-row"><button class="btn-detail" data-detail-key="${key}">+ details</button></div>`
    : '';
  return `<div class="section"><div class="section-label">${cfg.heading}</div>${body}${detail}</div>`;
}

function grid(items, sectionKey) { return `<div class="btn-grid">${buttons(items, sectionKey)}</div>`; }

function buttons(items, sectionKey) {
  return items.map(it =>
    `<button class="item" data-id="${it.id}" data-section="${sectionKey}">${it.label} <span class="price">$${it.price}</span></button>`
  ).join('');
}

function stepperRow(id, label, priceLabel, col) {
  const style = col ? ` style="grid-column:${col}"` : '';
  return `<div class="mobile-row" id="row-${id}"${style}>
    <div class="mobile-label">${label} <span class="price">$${priceLabel}</span></div>
    <div class="stepper">
      <button class="step-btn" id="dec-${id}" disabled>−</button>
      <span class="step-count" id="count-${id}">0</span>
      <button class="step-btn" id="inc-${id}">+</button>
    </div>
  </div>`;
}

/* ---- Helpers to find items ---- */
function findItem(id) {
  for (const key of Object.keys(CONFIG)) {
    const sec = CONFIG[key];
    if (sec.items) { const it = sec.items.find(i => i.id === id); if (it) return {item:it, sectionKey:key}; }
  }
  return null;
}

/* ---- Bundle discounts (returns [{label, amount}]) ---- */
function getBundleDiscounts() {
  const internetOn = isCategoryOn('internet');
  if (!internetOn) return [];
  const out = [];
  const tvOn    = isCategoryOn('tv');
  const voiceOn = isCategoryOn('voice');
  const secOn   = isCategoryOn('security');
  const bundled = [tvOn, voiceOn, secOn].filter(Boolean).length;
  if (bundled === 1) out.push({label:'💰 Double play discount (Internet + 1 service)', amount:CONFIG.discounts.doublePlay});
  if (bundled === 2) out.push({label:'💰 Triple play discount (Internet + 2 services)', amount:CONFIG.discounts.triplePlay});
  if (bundled >= 3) out.push({label:'💰 Quad play discount (Internet + 3 services)', amount:CONFIG.discounts.quadPlay});

  const mobileOn = (state.steppers.select||0) + (state.steppers.plus||0) > 0;
  if (mobileOn) out.push({label:'💰 Mobile bundle discount', amount:CONFIG.discounts.mobile});
  return out;
}

// Is any item whose bundleCategory === cat currently selected?
function isCategoryOn(cat) {
  for (const key of Object.keys(CONFIG)) {
    const sec = CONFIG[key];
    if (sec.bundleCategory !== cat || !sec.items) continue;
    if (sec.items.some(i => state.selected[i.id])) return true;
  }
  return false;
}

/* ---- Detail text (TV pulls dynamic templates from CONFIG.tv) ---- */
function getDetailText(key) {
  if (key === 'tv') {
    const picked = CONFIG.tv.items.find(i => state.selected[i.id]);
    if (!picked)                  return CONFIG.tv.detailsWhenNone;
    if (picked.kind === 'stream') return CONFIG.tv.detailsWhenStream;
    return CONFIG.tv.detailsWhenCable.replace('{dvr}', picked.dvr);
  }
  return CONFIG[key] ? CONFIG[key].details : null;
}

/* ---- Build the ordered list of summary lines ---- */
function getAllOutputLines() {
  const result = [];
  const pushDetail = (key) => { if (state.details[key]) { const d = getDetailText(key); if (d) result.push({text:d, detail:true}); } };

  // INTERNET + ESSENTIALS
  ['internet','essentials'].forEach(key => {
    CONFIG[key].items.forEach(it => { if (state.selected[it.id]) result.push({text: summaryFor(it), detail:false}); });
    pushDetail(key);
  });

  // TELEVISION
  CONFIG.tv.items.forEach(it => { if (state.selected[it.id]) result.push({text: summaryFor(it), detail:false}); });
  pushDetail('tv');

  // STREAMSAVER
  CONFIG.stream.items.forEach(it => { if (state.selected[it.id]) result.push({text: summaryFor(it), detail:false}); });
  pushDetail('stream');

  // MOBILE lines
  const mobParts = [];
  CONFIG.mobile.lines.forEach(l => {
    const n = state.steppers[l.id] || 0;
    if (n > 0) mobParts.push(`${l.summaryName} × ${n}: $${n*l.price}ᴍᴏ`);
  });
  if (mobParts.length) result.push({text:`𝐌𝐨𝐛𝐢𝐥𝐞: ${mobParts.join(' · ')}`, detail:false});

  // MOBILE devices (watch/tablet) with combined cap
  const devParts = [];
  let devRaw = 0;
  CONFIG.mobile.devices.forEach(d => {
    const n = state.steppers[d.id] || 0;
    if (n > 0) { devParts.push(`${d.summaryName} $${d.price}ᴍᴏ × ${n}`); devRaw += n*d.price; }
  });
  if (devParts.length) {
    const billed = Math.min(devRaw, CONFIG.mobile.deviceCap);
    result.push({text:`${devParts.join(' · ')} · billed $${billed}ᴍᴏ`, detail:false});
  }
  pushDetail('mobile');

  // SECURITY (combine smart home + pro monitoring)
  const shOn  = state.selected['smarthome'];
  const proOn = state.selected['promon'];
  if (shOn || proOn) {
    let line = '𝐒𝐞𝐜𝐮𝐫𝐢𝐭𝐲:';
    if (shOn && proOn) line += ` Smart Home + Pro Monitoring $${CONFIG.security.combinedPrice}ᴍᴏ`;
    else if (shOn)     line += ` Smart Home $${CONFIG.security.items[0].price}ᴍᴏ`;
    else               line += ` Pro Monitoring $${CONFIG.security.items[1].price}ᴍᴏ`;
    result.push({text:line, detail:false});
  }
  // Cameras — formatted like mobile lines (Name × N: $total ᴍᴏ)
  const camParts = [];
  CONFIG.security.cameras.forEach(c => {
    const n = state.steppers[c.id] || 0;
    if (n > 0) camParts.push(`${c.summaryName} × ${n}: $${(n*c.price).toFixed(2).replace(/\.00$/,'')}ᴍᴏ`);
  });
  if (camParts.length) result.push({text:`𝐂𝐚𝐦𝐬: ${camParts.join(' · ')}`, detail:false});
  pushDetail('security');

  // VOICE
  CONFIG.voice.items.forEach(it => { if (state.selected[it.id]) result.push({text: summaryFor(it), detail:false}); });
  pushDetail('voice');

  // DISCOUNTS
  getBundleDiscounts().forEach(d => result.push({text:d.label, detail:false}));

  return result;
}

// Return the correct summary for an item (NOW TV may be upgraded)
function summaryFor(it) {
  if (it.id === 'nowtv' && state.addonActive) return NOW_UPGRADED;
  return it.summary;
}

/* ---- Running total ---- */
function computeTotal() {
  let gross = 0;
  // toggle items
  for (const key of Object.keys(CONFIG)) {
    const sec = CONFIG[key];
    if (!sec.items) continue;
    sec.items.forEach(it => { if (state.selected[it.id]) gross += it.price; });
  }
  // NOW add-on bump
  if (state.selected['nowtv'] && state.addonActive) gross += NOW_ADDON.price;
  // security combine correction: both selected -> use combinedPrice instead of 10+45
  if (state.selected['smarthome'] && state.selected['promon']) {
    gross -= (CONFIG.security.items[0].price + CONFIG.security.items[1].price);
    gross += CONFIG.security.combinedPrice;
  }
  // mobile lines
  CONFIG.mobile.lines.forEach(l => gross += (state.steppers[l.id]||0) * l.price);
  // mobile devices (capped)
  let devRaw = 0;
  CONFIG.mobile.devices.forEach(d => devRaw += (state.steppers[d.id]||0) * d.price);
  gross += Math.min(devRaw, CONFIG.mobile.deviceCap);
  // cameras
  CONFIG.security.cameras.forEach(c => gross += (state.steppers[c.id]||0) * c.price);

  const totalDiscount = getBundleDiscounts().reduce((s,d)=>s+d.amount, 0);
  monthlyTotal = Math.max(0, gross - totalDiscount);
  return { monthlyTotal, totalDiscount };
}

/* ---- Render ---- */
function render() {
  const preview = document.getElementById('preview');
  const allLines = getAllOutputLines();
  const disc = getBundleDiscounts();

  // item count = selected toggles + active steppers
  let itemCount = Object.values(state.selected).filter(Boolean).length;
  Object.values(state.steppers).forEach(n => { if (n>0) itemCount++; });

  document.getElementById('countBadge').textContent = itemCount + (itemCount===1?' item':' items');
  document.getElementById('totalCount').textContent = itemCount;

  const { monthlyTotal:mt, totalDiscount } = computeTotal();
  const rtEl = document.getElementById('runningTotal');
  if (rtEl) {
    if (mt > 0) {
      const discStr = totalDiscount > 0 ? ` (−$${totalDiscount} disc.)` : '';
      rtEl.textContent = `$${Math.round(mt)}ᴍᴏ${discStr}`;
    } else rtEl.textContent = '$0ᴍᴏ';
  }

  const da = document.getElementById('discountArea');
  if (disc.length) { da.style.display='block'; document.getElementById('discountLines').textContent = disc.map(d=>d.label).join('\n'); }
  else da.style.display='none';

  if (!allLines.length) {
    preview.innerHTML = '<span class="empty">Click items to build your plan summary...</span>';
    return;
  }

  preview.innerHTML = allLines.map(item => {
    const esc = item.text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
    const ctrl = !item.detail
      ? `<button class="line-remove" data-text="${encodeURIComponent(item.text)}" title="Remove">×</button>`
      : `<span class="no-rm"></span>`;
    return `<div class="line${item.detail?' detail-line':''}">${ctrl}<span class="line-text">${esc}</span></div>`;
  }).join('');

  // Remove buttons in the summary
  preview.querySelectorAll('.line-remove').forEach(btn => {
    btn.addEventListener('click', () => {
      const text = decodeURIComponent(btn.getAttribute('data-text'));
      removeBySummary(text);
    });
  });
}

// Remove a line by its summary text (maps back to whatever produced it)
function removeBySummary(text) {
  // toggle items
  const hit = (function(){
    for (const key of Object.keys(CONFIG)) {
      const sec = CONFIG[key];
      if (!sec.items) continue;
      const it = sec.items.find(i => summaryFor(i) === text || i.summary === text);
      if (it) return it;
    }
    return null;
  })();
  if (hit) { deselectItem(hit.id); return; }

  // NOW upgraded line
  if (text === NOW_UPGRADED) { deselectItem('nowtv'); return; }

  // Mobile / cameras / devices lines → clear the relevant steppers
  if (text.startsWith('𝐌𝐨𝐛𝐢𝐥𝐞:')) { CONFIG.mobile.lines.forEach(l => setStepper(l.id, 0)); return; }
  if (text.startsWith('𝐂𝐚𝐦𝐬:'))  { CONFIG.security.cameras.forEach(c => setStepper(c.id, 0)); return; }
  if (/Smartwatch|Tablet/.test(text) && text.includes('billed')) { CONFIG.mobile.devices.forEach(d => setStepper(d.id, 0)); return; }
  if (text.startsWith('𝐒𝐞𝐜𝐮𝐫𝐢𝐭𝐲:')) { deselectItem('smarthome'); deselectItem('promon'); return; }
}

/* ---- Selection logic ---- */
function selectItem(id) {
  const found = findItem(id);
  if (!found) return;
  const { item, sectionKey } = found;
  const sec = CONFIG[sectionKey];

  // exclusive group: deselect siblings across ALL sections sharing this group
  if (sec.exclusive) {
    Object.keys(CONFIG).forEach(k => {
      const s = CONFIG[k];
      if (s.exclusive === sec.exclusive && s.items) {
        s.items.forEach(i => { if (i.id !== id) deselectItem(i.id, true); });
      }
    });
  }
  state.selected[id] = true;
  syncButtons();
  postSelectHooks(id, true);
}

function deselectItem(id, silent) {
  state.selected[id] = false;
  // if NOW TV deselected, reset addon
  if (id === 'nowtv') { state.addonActive = false; const ab=document.getElementById('btn-now-addon'); if(ab) ab.classList.remove('active'); }
  // if smart home deselected, drop pro monitoring
  if (id === 'smarthome' && state.selected['promon']) state.selected['promon'] = false;
  if (!silent) { syncButtons(); postSelectHooks(id, false); }
}

function postSelectHooks(id, on) {
  // NOW add-on availability
  updateAddonBtn();
  // Pro monitoring requires smart home
  updateRequiresBtns();
  render();
}

function toggleItem(id) {
  if (state.selected[id]) deselectItem(id);
  else selectItem(id);
}

/* ---- Reflect state onto buttons ---- */
function syncButtons() {
  document.querySelectorAll('button.item[data-id]').forEach(b => {
    b.classList.toggle('active', !!state.selected[b.getAttribute('data-id')]);
  });
}

function updateAddonBtn() {
  const ab = document.getElementById('btn-now-addon');
  if (!ab) return;
  const nowOn = !!state.selected['nowtv'];
  ab.classList.toggle('disabled', !nowOn);
  ab.classList.toggle('active', state.addonActive && nowOn);
  if (!nowOn) state.addonActive = false;
}

function updateRequiresBtns() {
  document.querySelectorAll('button.item[data-id]').forEach(b => {
    const found = findItem(b.getAttribute('data-id'));
    if (found && found.item.requires) {
      const ok = !!state.selected[found.item.requires];
      b.classList.toggle('disabled', !ok);
      if (!ok && state.selected[found.item.id]) state.selected[found.item.id] = false;
    }
  });
}

/* ---- Steppers ---- */
function setStepper(id, n) { state.steppers[id] = n; syncStepper(id); render(); }

function syncStepper(id) {
  const n = state.steppers[id] || 0;
  const cnt = document.getElementById(`count-${id}`);
  const dec = document.getElementById(`dec-${id}`);
  const row = document.getElementById(`row-${id}`);
  if (cnt) cnt.textContent = n;
  if (dec) dec.disabled = n === 0;
  if (row) row.classList.toggle('active', n > 0);
}

function stepperCanInc(id) {
  // camera combined cap
  if (CONFIG.security.cameras.some(c => c.id === id)) {
    const total = CONFIG.security.cameras.reduce((s,c)=>s+(state.steppers[c.id]||0),0);
    return total < CONFIG.security.cameraMax;
  }
  // generic per-stepper max
  return (state.steppers[id]||0) < CONFIG.mobile.maxPerStepper;
}

function wireStepper(id) {
  const inc = document.getElementById(`inc-${id}`);
  const dec = document.getElementById(`dec-${id}`);
  inc.addEventListener('click', e => { e.stopPropagation(); if (stepperCanInc(id)) { state.steppers[id]=(state.steppers[id]||0)+1; syncAllStepperCaps(); render(); } });
  dec.addEventListener('click', e => { e.stopPropagation(); if ((state.steppers[id]||0)>0) { state.steppers[id]--; syncAllStepperCaps(); render(); } });
  syncStepper(id);
}

// Re-evaluate the + button disabled state for capped steppers
function syncAllStepperCaps() {
  const allIds = [
    ...CONFIG.mobile.lines.map(l=>l.id),
    ...CONFIG.mobile.devices.map(d=>d.id),
    ...CONFIG.security.cameras.map(c=>c.id),
  ];
  allIds.forEach(id => {
    syncStepper(id);
    const inc = document.getElementById(`inc-${id}`);
    if (inc) inc.disabled = !stepperCanInc(id);
  });
}

/* ---- Wire up everything after build ---- */
function wire() {
  // item buttons
  document.querySelectorAll('button.item[data-id]').forEach(b => {
    b.addEventListener('click', () => toggleItem(b.getAttribute('data-id')));
  });

  // NOW add-on button
  const addon = document.getElementById('btn-now-addon');
  if (addon) addon.addEventListener('click', () => {
    if (!state.selected['nowtv']) return;
    state.addonActive = !state.addonActive;
    updateAddonBtn();
    render();
  });

  // detail toggles
  document.querySelectorAll('.btn-detail').forEach(btn => {
    btn.addEventListener('click', () => {
      const k = btn.getAttribute('data-detail-key');
      state.details[k] = !state.details[k];
      btn.classList.toggle('active', !!state.details[k]);
      btn.textContent = state.details[k] ? '− details' : '+ details';
      render();
    });
  });

  // steppers
  [...CONFIG.mobile.lines, ...CONFIG.mobile.devices, ...CONFIG.security.cameras].forEach(s => wireStepper(s.id));

  // copy full summary
  const copyIcon = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;
  document.getElementById('copyBtn').addEventListener('click', () => {
    const all = getAllOutputLines();
    if (!all.length) return;
    const text = all.map(l=>l.text).join('\n');
    const btn = document.getElementById('copyBtn');
    const done = () => { btn.classList.add('success'); btn.textContent='✓ Copied!'; setTimeout(()=>{ btn.classList.remove('success'); btn.innerHTML=copyIcon+' Copy to clipboard'; },2000); };
    copyText(text, done);
  });

  // copy total (number only)
  document.getElementById('copyTotalBtn').addEventListener('click', () => {
    const btn = document.getElementById('copyTotalBtn');
    const done = () => { btn.classList.add('success'); setTimeout(()=>btn.classList.remove('success'),1500); };
    copyText(`${Math.round(monthlyTotal)}`, done);
  });

  // clear
  document.getElementById('clearBtn').addEventListener('click', () => {
    state.selected = {}; state.steppers = {}; state.details = {}; state.addonActive = false;
    syncButtons();
    document.querySelectorAll('.btn-detail.active').forEach(b => { b.classList.remove('active'); b.textContent='+ details'; });
    [...CONFIG.mobile.lines, ...CONFIG.mobile.devices, ...CONFIG.security.cameras].forEach(s => syncStepper(s.id));
    syncAllStepperCaps();
    updateAddonBtn(); updateRequiresBtns();
    render();
  });
}

function copyText(text, done) {
  navigator.clipboard.writeText(text).then(done).catch(() => {
    const ta = Object.assign(document.createElement('textarea'), {value:text});
    ta.style.cssText = 'position:absolute;left:-9999px';
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); done();
  });
}

/* ---- Init ---- */
build();
wire();
updateAddonBtn();
updateRequiresBtns();
render();
</script>
</body>
</html>
